# Aparece nos logs. Ajuda a saber qual aplicação está falando quando você
# tiver várias rodando ao mesmo tempo.
spring.application.name=vagas

# A porta fica no padrão do Spring Boot, 8080: é a que os arquivos .http deste
# repositório chamam. Trocar aqui é trocar lá também.

# =============================================================================
# AULA 05 · o banco
# =============================================================================
# Nome fixo. Sem esta linha o Spring sorteia um nome a cada partida, e para
# abrir o console você teria que caçar o nome no log toda vez.
spring.datasource.url=jdbc:h2:mem:vagas

# O console web do H2, em http://localhost:8080/h2-console. Só em
# desenvolvimento: ele abre o banco inteiro para quem acertar o endereço.
spring.h2.console.enabled=true

# create-drop cria tudo na subida e apaga na descida — certo para banco em
# memória, que some de qualquer jeito. Nunca em produção.
spring.jpa.hibernate.ddl-auto=create-drop

# O SQL que o Hibernate escreve por você, no log. Formatado, para dar para ler.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# A carga inicial roda DEPOIS de o Hibernate criar as tabelas. Sem esta linha
# ela roda antes, e o primeiro INSERT não acha a tabela.
spring.jpa.defer-datasource-initialization=true

# Um arquivo de carga por frente. A ordem é de propósito: na aula 07 a vaga
# passa a apontar para a empresa, e a empresa precisa existir antes.
spring.sql.init.data-locations=classpath:dados/empresas.sql,classpath:dados/vagas.sql,classpath:dados/pessoas.sql
